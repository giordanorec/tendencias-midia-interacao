<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futuros — entrar — Tendências em Mídia e Interação</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23db1e2f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/hub.css">
<link rel="stylesheet" href="/futuros/futuros.css">
<script>try{var t=localStorage.getItem("tema");if(t==="claro"||t==="escuro")document.documentElement.setAttribute("data-tema",t);}catch(e){}</script>
</head>
<body>
<header class="topo">
  <div class="pagina topo__interno">
    <a class="marca" href="/"><span class="marca__ponto" aria-hidden="true"></span>Tendências em Mídia e Interação</a>
    <nav aria-label="Principal"><a href="/#agora">Agora</a><a href="/temas/">Temas</a><a href="/materiais/">Materiais</a></nav>
  </div>
</header>
<main id="conteudo">
<section class="estreita entrar">
  <p class="rotulo">Futuros · CIN0055 · 2026.2</p>
  <h1>Os futuros da turma</h1>
  <p class="olho" id="msg">Cada tema é aberto para a turma no dia da aula em que é apresentado. Antes disso, só o professor entra.</p>
  <form method="post" action="/api/futuros-entrar" class="entrar__form">
    <input type="hidden" name="de" id="de" value="/futuros/">
    <label for="senha">Senha do professor</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required autofocus>
    <button class="botao botao--principal" type="submit">Entrar</button>
  </form>
  <p class="entrar__erro" id="erro" hidden>Senha não confere.</p>
  <p class="doc-nav"><a class="botao botao--linha" href="/">← Voltar à central</a></p>
</section>
</main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('de')) document.getElementById('de').value = q.get('de');
  if (q.get('erro')) document.getElementById('erro').hidden = false;
  var m = (q.get('de') || '').match(/^\/futuros\/(\d{2})-/);
  if (m) document.getElementById('msg').textContent = 'O tema ' + parseInt(m[1], 10) + ' ainda não foi aberto para a turma: ele abre no dia da aula em que é apresentado. Antes disso, só o professor entra.';
</script>
</body>
</html>
